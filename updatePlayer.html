
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Player | Cricket Squad Manager</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #101827, #172c35, #10251f);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
            color: white;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: #1c2935;
            padding: 35px;
            border: 1px solid #344451;
            border-radius: 18px;
            box-shadow: 0 15px 45px #0006;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #9eafb9;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #dce5eb;
        }

        input, select {
            width: 100%;
            padding: 13px;
            background: #263744;
            color: white;
            border: 1px solid #405360;
            border-radius: 8px;
            outline: none;
            margin-bottom: 20px;
        }

        input:focus, select:focus {
            border-color: #20c997;
        }

        option {
            background: #263744;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #20c997;
            color: #10251f;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #16a77d;
        }

        .back {
            display: block;
            text-align: center;
            color: #20c997;
            text-decoration: none;
            margin-top: 22px;
        }

        @media(max-width: 500px) {
            .row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🏏 Update Player</h1>
    <p class="subtitle">Modify existing player details</p>

    <form action="http://localhost:8081/CricketSquadManager/update-player"
          method="POST">

        <label>Player ID *</label>
        <input type="number" name="playerId"
               min="1" placeholder="Enter existing Player ID" required>

        <label>Player Name *</label>
        <input type="text" name="playerName"
               placeholder="Enter player name" required>

        <div class="row">

            <div>
                <label>Age *</label>
                <input type="number" name="age"
                       min="1" max="100" required>
            </div>

            <div>
                <label>Player Role *</label>
                <select name="role" required>
                    <option value="">Select Role</option>
                    <option value="WICKETKEEPER">Wicketkeeper</option>
                    <option value="BATSMAN">Batsman</option>
                    <option value="BOWLER">Bowler</option>
                    <option value="ALL_ROUNDER">All Rounder</option>
                </select>
            </div>

        </div>

        <label>Batting Style</label>
        <select name="battingStyle">
            <option value="">None (NULL)</option>
            <option value="RIGHT_HAND">Right Hand Bat</option>
            <option value="LEFT_HAND">Left Hand Bat</option>
        </select>

        <label>Bowling Style</label>
        <select name="bowlingStyle">
            <option value="">None (NULL)</option>
            <option value="RIGHT_ARM_FAST">Right Arm Fast</option>
            <option value="RIGHT_ARM_FAST_MEDIUM">Right Arm Fast Medium</option>
            <option value="RIGHT_ARM_MEDIUM">Right Arm Medium</option>
            <option value="RIGHT_ARM_OFFBREAK">Right Arm Off Break</option>
            <option value="RIGHT_ARM_LEGSPIN">Right Arm Leg Spin</option>
            <option value="LEFT_ARM_FAST">Left Arm Fast</option>
            <option value="LEFT_ARM_FAST_MEDIUM">Left Arm Fast Medium</option>
            <option value="LEFT_ARM_ORTHODOX">Left Arm Orthodox</option>
            <option value="LEFT_ARM_WRIST_SPIN">Left Arm Wrist Spin</option>
        </select>

        <button type="submit">Update Player</button>

    </form>

    <a href="index.html" class="back">← Back to Home</a>

</div>

</body>
</html>
