
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Player | Cricket Squad Manager</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #101827, #172c35, #10251f);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: #1c2935;
            padding: 35px;
            border: 1px solid #344451;
            border-radius: 18px;
            box-shadow: 0 15px 45px #0006;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #9eafb9;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-weight: 600;
            color: #dce5eb;
        }

        input {
            width: 100%;
            padding: 14px;
            background: #263744;
            border: 1px solid #405360;
            border-radius: 8px;
            color: white;
            outline: none;
            margin-bottom: 22px;
        }

        input:focus {
            border-color: #ff7373;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #bd2130;
        }

        .warning {
            color: #ffb3b3;
            background: #512c35;
            padding: 12px;
            border-radius: 7px;
            font-size: 13px;
            margin-bottom: 22px;
            line-height: 1.5;
        }

        .back {
            display: block;
            text-align: center;
            color: #20c997;
            text-decoration: none;
            margin-top: 22px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🗑️ Delete Player</h1>

    <p class="subtitle">Remove a player from your squad</p>

    <div class="warning">
        Warning: Deleting a player is permanent.
        Please verify the Player ID before submitting.
    </div>

    <form action="http://localhost:8081/CricketSquadManager/delete-player"
          method="POST">

        <label>Player ID</label>

        <input type="number"
               name="playerId"
               min="1"
               placeholder="Enter Player ID"
               required>

        <button type="submit"
                onclick="return confirm('Are you sure you want to delete this player?')">
            Delete Player
        </button>

    </form>

    <a href="index.html" class="back">← Back to Home</a>

</div>

</body>
</html>
