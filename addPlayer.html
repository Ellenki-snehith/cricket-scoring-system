
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Player | Cricket Squad Manager</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #101827, #172c35, #10251f);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            color: #fff;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: #1c2935;
            padding: 35px;
            border-radius: 18px;
            border: 1px solid #344451;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.4);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header .icon {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 27px;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .header p {
            color: #9eafb9;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #dce5eb;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 13px 14px;
            background: #263744;
            border: 1px solid #405360;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        input:focus, select:focus {
            border-color: #20c997;
            box-shadow: 0 0 0 3px rgba(32, 201, 151, 0.15);
        }

        input::placeholder {
            color: #8d9da7;
        }

        select option {
            background: #263744;
            color: white;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: #20c997;
            color: #10251f;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background: #16a77d;
            transform: translateY(-2px);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #20c997;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .required {
            color: #ff7373;
        }

        @media(max-width: 500px) {
            .container {
                padding: 25px 18px;
            }

            .row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="icon">🏏</div>
        <h1>Add New Player</h1>
        <p>Register a player in your cricket squad</p>
    </div>

    <form action="http://localhost:8081/CricketSquadManager/add-player"
          method="POST">

        <div class="form-group">
            <label>Player Name <span class="required">*</span></label>
            <input type="text"
                   name="playerName"
                   placeholder="Enter player name"
                   required>
        </div>

        <div class="row">

            <div class="form-group">
                <label>Age <span class="required">*</span></label>
                <input type="number"
                       name="age"
                       min="1"
                       max="100"
                       placeholder="Enter age"
                       required>
            </div>

            <div class="form-group">
                <label>Player Role <span class="required">*</span></label>
                <select name="role" required>
                    <option value="">Select Role</option>
                    <option value="WICKETKEEPER">Wicketkeeper</option>
                    <option value="BATSMAN">Batsman</option>
                    <option value="BOWLER">Bowler</option>
                    <option value="ALL_ROUNDER">All Rounder</option>
                </select>
            </div>

        </div>

        <div class="form-group">
            <label>Batting Style</label>
            <select name="battingStyle">
                <option value="">None (NULL)</option>
                <option value="RIGHT_HAND">Right Hand Bat</option>
                <option value="LEFT_HAND">Left Hand Bat</option>
            </select>
        </div>

        <div class="form-group">
            <label>Bowling Style</label>
            <select name="bowlingStyle">
                <option value="">None (NULL)</option>
                <option value="RIGHT_ARM_FAST">Right Arm Fast</option>
                <option value="RIGHT_ARM_FAST_MEDIUM">Right Arm Fast Medium</option>
                <option value="RIGHT_ARM_MEDIUM">Right Arm Medium</option>
                <option value="RIGHT_ARM_OFFBREAK">Right Arm Off Break</option>
                <option value="RIGHT_ARM_LEGSPIN">Right Arm Leg Spin</option>
                <option value="LEFT_ARM_FAST">Left Arm Fast</option>
                <option value="LEFT_ARM_FAST_MEDIUM">Left Arm Fast Medium</option>
                <option value="LEFT_ARM_ORTHODOX">Left Arm Orthodox</option>
                <option value="LEFT_ARM_WRIST_SPIN">Left Arm Wrist Spin</option>
            </select>
        </div>

        <button type="submit" class="submit-btn">
            + Add Player
        </button>

    </form>

    <a href="index.html" class="back-link">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
