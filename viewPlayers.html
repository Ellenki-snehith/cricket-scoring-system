
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Players | Cricket Squad Manager</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #101827, #172c35, #10251f);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 550px;
            background: #1c2935;
            padding: 45px 35px;
            border: 1px solid #344451;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 15px 45px #0006;
        }

        .icon {
            font-size: 55px;
        }

        h1 {
            margin: 15px 0 10px;
        }

        p {
            color: #aab8c2;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .view-btn {
            display: inline-block;
            padding: 14px 30px;
            background: #20c997;
            color: #10251f;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .view-btn:hover {
            background: #16a77d;
            transform: translateY(-2px);
        }

        .back {
            display: block;
            color: #20c997;
            text-decoration: none;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">🏏</div>

        <h1>Player Directory</h1>

        <p>
            View all registered cricket players,
            their roles, batting styles and bowling styles.
        </p>

        <a class="view-btn"
           href="http://localhost:8081/CricketSquadManager/view-players">
            View All Players
        </a>

        <a class="back" href="index.html">
            ← Back to Home
        </a>

    </div>

</body>
</html>
